<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14231b"><title>前台内容｜英歌舞数字博物馆</title><link rel="icon" href="../assets/museum-logo.png"><link rel="stylesheet" href="content.css"></head>
<body>
  <div class="content-shell">
    <aside class="content-rail"><a class="content-brand" href="index.html"><img src="../assets/museum-logo.png" alt=""><span><strong>前台内容</strong><small>可视化编辑工作区</small></span></a><div class="rail-line"></div><p class="rail-label">页面</p><nav class="page-list"><button class="page-link is-active" data-page="home" type="button"><span>01</span><b>首页门厅</b><small>首屏与三项核心展项</small></button><button class="page-link" data-page="content" type="button"><span>02</span><b>数字展馆</b><small>馆藏与参观路径</small></button><button class="page-link" data-page="watch" type="button"><span>03</span><b>声音与影像</b><small>团队视频接入位置</small></button><button class="page-link" data-page="mugeda" type="button"><span>04</span><b>互动特展</b><small>木疙瘩 H5 接入位置</small></button></nav><a class="back-link" href="index.html">返回可视化管理台</a></aside>
    <main class="content-main"><header class="content-header"><div><p class="eyebrow">B 端内容管理</p><h1>前台内容编辑</h1><p class="header-sub">修改这里，公众前台的文字和内容状态会同步更新。页面结构与动效由开发维护。</p></div><div class="header-actions"><span id="saveState" class="save-state">草稿未修改</span><button id="preview" class="button button-quiet" type="button">打开前台预览</button><button id="save" class="button button-primary" type="button">保存并发布</button></div></header>
      <div class="editor-grid"><section class="editor-panel"><div class="panel-heading"><div><p class="eyebrow">当前页面 / 首页门厅</p><h2>编辑首页内容</h2></div><span class="draft-badge">DRAFT</span></div><form id="contentForm"><fieldset><legend>首屏 Hero</legend><label>眉题<input name="hero.eyebrow" maxlength="50"></label><label>主标题第一行<input name="hero.titleLine1" maxlength="30"></label><label>主标题第二行<input name="hero.titleLine2" maxlength="30"></label><label>说明文字<textarea name="hero.body" rows="2" maxlength="140"></textarea></label><label>主按钮文字<input name="hero.primaryCta" maxlength="20"></label></fieldset><fieldset><legend>三项核心展项</legend><div class="field-note">这些内容对应公众前台首页的三个入口，不负责修改图片和链接。</div><label>视频展项标题<input name="experiences.cards.video.title" maxlength="20"></label><label>视频展项说明<textarea name="experiences.cards.video.description" rows="2" maxlength="100"></textarea></label><label>互动特展标题<input name="experiences.cards.h5.title" maxlength="20"></label><label>互动特展说明<textarea name="experiences.cards.h5.description" rows="2" maxlength="100"></textarea></label><label>智能体标题<input name="experiences.cards.agent.title" maxlength="20"></label><label>智能体说明<textarea name="experiences.cards.agent.description" rows="2" maxlength="100"></textarea></label></fieldset><fieldset><legend>展项区标题</legend><label>区块标题<input name="experiences.title" maxlength="30"></label><label>区块说明<textarea name="experiences.intro" rows="2" maxlength="120"></textarea></label></fieldset></form></section><section class="preview-panel"><div class="preview-heading"><div><p class="eyebrow">实时预览</p><h2>公众前台</h2></div><span>首页 / 1440 × 900</span></div><div class="preview-frame"><iframe id="previewFrame" title="公众前台预览" src="../index.html?preview=1"></iframe></div></section></div>
      <div class="reserved-strip"><div><p class="eyebrow">接入预留</p><h3>视频与木疙瘩素材到位后，从对应页面接入</h3><p>当前只编辑可公开的文字内容，不会把尚未交付的素材伪装成已上线。</p></div><div class="reserved-links"><a href="watch.html">视频展位 <span>预留</span></a><a href="mugeda.html">木疙瘩 H5 <span>预留</span></a></div></div>
    </main>
  </div>
  <script src="content.js"></script>
</body></html>
