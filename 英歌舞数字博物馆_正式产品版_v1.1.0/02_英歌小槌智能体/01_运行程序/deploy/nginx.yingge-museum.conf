# Template only. Install this as an Nginx server include after replacing the
# certificate paths for the production host. It deliberately serves the public
# site directly and keeps the Node service on loopback.
server {
    listen 80;
    listen [::]:80;
    server_name yinggemus.cn www.yinggemus.cn;
    return 308 https://yinggemus.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yinggemus.cn www.yinggemus.cn;

    root /srv/yingge-museum/current/web;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/yinggemus.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yinggemus.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
    # The public site has reviewed inline bootstrap code; replacing it with a
    # nonce-based policy needs a coordinated frontend migration first.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://yinggemus.cn wss://yinggemus.cn; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:" always;

    # This is the public, stable embed address. It may be stored by a browser
    # or WebView, but must be revalidated with its ETag on every document load.
    # Do not replace this with immutable caching while callers use the bare URL.
    location = /mugeda-agent.js {
        try_files $uri =404;
        etag on;
        if_modified_since exact;
        expires off;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate, s-maxage=0" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public projection is generated outside both the release and private
    # state roots. It is the only runtime-generated file exposed here.
    location = /data/exhibits.public.json {
        alias /var/lib/yingge-museum/public/data/exhibits.public.json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never make retrieval indexes, provenance registers, build reports or
    # private admin state downloadable from the public static tree.
    location ~* ^/(?:data/(?:chunks\.jsonl|lexical_index\.json|source_registry\.json|build_report\.json)|admin-auth\.json|model-settings\.json|install-key\.bin)(?:/|$) {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Nginx uses this internal subrequest before it serves administrative
    # static pages. Keep the exact no-trailing-slash backend route: server.mjs
    # deliberately exposes /api/admin/session, not /api/admin/session/.
    location = /_museum_auth {
        internal;
        proxy_method GET;
        proxy_pass http://127.0.0.1:8787/api/admin/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $scheme://$host;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    location ^~ /admin/ {
        auth_request /_museum_auth;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
