<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">英歌小槌知识补充闭环</title>
  <desc id="desc">从访客提问、质量信号、自动进入待核验队列、人工补证审核、知识库发布、重建索引到下一次更可靠回答的流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10291f"/>
      <stop offset="1" stop-color="#1c3b2c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f6ed"/>
      <stop offset="1" stop-color="#eee9dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#07170f" flood-opacity=".26"/>
    </filter>
    <marker id="arrow" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2L11 7 2 12" fill="none" stroke="#e77855" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .kicker{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:22px;letter-spacing:5px;font-weight:700;fill:#e6aa78}
      .headline{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:54px;font-weight:800;fill:#f9f6ed}
      .subtitle{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:22px;fill:#cdd8ce}
      .card-title{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:25px;font-weight:800;fill:#173326}
      .card-copy{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:17px;fill:#577060}
      .card-number{font-family:Arial,sans-serif;font-size:16px;font-weight:800;fill:#b75139}
      .tag{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:15px;font-weight:800;fill:#a94934}
      .section-label{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:16px;font-weight:800;fill:#f0c7a0;letter-spacing:2px}
      .note{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:18px;font-weight:700;fill:#f7eee0}
      .note-small{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:15px;fill:#d8e1d8}
      .tiny{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:14px;fill:#e1e9e1}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <path d="M0 138C210 66 367 210 575 151s398-145 611-56 422 94 734-92" fill="none" stroke="#cf664b" stroke-width="1.5" opacity=".56"/>
  <path d="M0 956c195-74 402 35 622-35 173-55 283-165 480-86 235 93 441 52 818-105" fill="none" stroke="#f2b978" stroke-width="1.5" opacity=".42"/>
  <circle cx="1584" cy="166" r="154" fill="none" stroke="#d97250" stroke-width="1.5" opacity=".35"/>
  <circle cx="1570" cy="172" r="116" fill="none" stroke="#d5b675" stroke-width="1" opacity=".3"/>

  <text x="130" y="130" class="kicker">英歌小槌 · 知识服务治理</text>
  <text x="128" y="197" class="headline">让每一次“没答好”，变成下一次更可靠的回答</text>
  <text x="130" y="240" class="subtitle">公开问答只使用已核验知识；缺口会被记录、补证、审核，再进入正式知识库。</text>

  <text x="132" y="330" class="section-label">前台：自动发现需要补证的问题</text>
  <text x="1064" y="330" class="section-label">后台：人工核验后才允许发布</text>

  <!-- Flow arrows -->
  <path d="M421 468H485" fill="none" stroke="#e77855" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M754 468H818" fill="none" stroke="#e77855" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1087 468H1151" fill="none" stroke="#e77855" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1420 468H1484" fill="none" stroke="#e77855" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1630 611c-3 101-89 145-190 145H465c-142 0-225-63-231-147" fill="none" stroke="#e7a672" stroke-width="2.5" stroke-dasharray="9 10" marker-end="url(#arrow)" opacity=".88"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="130" y="364" width="290" height="250" rx="25" fill="url(#card)"/>
  </g>
  <circle cx="166" cy="401" r="17" fill="#f4dfc4"/><text x="158" y="407" class="card-number">01</text>
  <path d="M182 438h96a13 13 0 0 1 13 13v43a13 13 0 0 1-13 13h-49l-23 19v-19h-24a13 13 0 0 1-13-13v-43a13 13 0 0 1 13-13z" fill="none" stroke="#b75139" stroke-width="3" stroke-linejoin="round"/>
  <path d="M196 466h67M196 484h47" stroke="#b75139" stroke-width="3" stroke-linecap="round"/>
  <text x="166" y="547" class="card-title">访客提问</text>
  <text x="166" y="578" class="card-copy">文字或语音向小槌提问</text>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="463" y="364" width="290" height="250" rx="25" fill="url(#card)"/>
  </g>
  <circle cx="499" cy="401" r="17" fill="#f4dfc4"/><text x="491" y="407" class="card-number">02</text>
  <path d="M540 441l56 0 18 33-18 33h-56l-18-33z" fill="#fce8dc" stroke="#b75139" stroke-width="3" stroke-linejoin="round"/>
  <path d="M568 453v25M568 491h.1" stroke="#b75139" stroke-width="4" stroke-linecap="round"/>
  <text x="499" y="547" class="card-title">质量信号识别</text>
  <text x="499" y="578" class="card-copy">低证据、无引用、点踩</text>
  <text x="499" y="601" class="card-copy">或识别出知识空缺</text>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="796" y="364" width="290" height="250" rx="25" fill="url(#card)"/>
  </g>
  <circle cx="832" cy="401" r="17" fill="#f4dfc4"/><text x="824" y="407" class="card-number">03</text>
  <rect x="853" y="438" width="86" height="70" rx="9" fill="#e7f0e8" stroke="#317257" stroke-width="3"/>
  <path d="M870 457h51M870 474h51M870 491h33" stroke="#317257" stroke-width="3" stroke-linecap="round"/>
  <circle cx="935" cy="500" r="18" fill="#e77855"/><path d="M927 500l5 5 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="832" y="547" class="card-title">自动标记 · 入队</text>
  <text x="832" y="578" class="card-copy">去重后进入后台的</text>
  <text x="832" y="601" class="card-copy">“待补知识”队列</text>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="1129" y="364" width="290" height="250" rx="25" fill="url(#card)"/>
  </g>
  <circle cx="1165" cy="401" r="17" fill="#f4dfc4"/><text x="1157" y="407" class="card-number">04</text>
  <circle cx="1200" cy="468" r="25" fill="#f0ddbd" stroke="#a47540" stroke-width="3"/>
  <path d="M1185 463c4-20 28-20 31 0M1185 484c8-12 23-12 31 0" fill="none" stroke="#795229" stroke-width="3" stroke-linecap="round"/>
  <path d="M1242 443h62v65h-62z" fill="#fffaf0" stroke="#a47540" stroke-width="3"/>
  <path d="M1255 460h36M1255 476h36M1255 492h22" stroke="#a47540" stroke-width="3" stroke-linecap="round"/>
  <text x="1165" y="547" class="card-title">馆员补证与审核</text>
  <text x="1165" y="578" class="card-copy">核对来源、地区／队伍／年代</text>
  <text x="1165" y="601" class="card-copy">并标注适用边界</text>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="1462" y="364" width="290" height="250" rx="25" fill="url(#card)"/>
  </g>
  <circle cx="1498" cy="401" r="17" fill="#f4dfc4"/><text x="1490" y="407" class="card-number">05</text>
  <path d="M1527 442h58l20 20v46h-78z" fill="#eff5ef" stroke="#317257" stroke-width="3" stroke-linejoin="round"/>
  <path d="M1585 442v20h20M1543 471h44M1543 488h33" stroke="#317257" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1498" y="547" class="card-title">正式知识库发布</text>
  <text x="1498" y="578" class="card-copy">通过闸门后写入</text>
  <text x="1498" y="601" class="card-copy">并保留来源依据</text>

  <!-- Lower feedback loop -->
  <rect x="346" y="729" width="1228" height="179" rx="32" fill="#173528" stroke="#476a56" stroke-width="1.5"/>
  <circle cx="412" cy="818" r="38" fill="#e77855"/>
  <path d="M394 818h36M412 800v36" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="480" y="786" class="tag">审核通过后</text>
  <text x="480" y="827" class="note">重建知识索引与引用映射</text>
  <text x="480" y="858" class="note-small">新资料获得可检索条目、来源链接和适用边界；未通过的任务保持待补或关闭，不进入公众回答。</text>
  <path d="M1225 818h103" fill="none" stroke="#e77855" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="1396" cy="818" r="38" fill="#95b99d"/>
  <path d="M1376 819l13 13 27-31" fill="none" stroke="#173528" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1451" y="810" class="note">下次回答更切题、可引用</text>
  <text x="1451" y="841" class="note-small">并继续监测新的问题与反馈</text>

  <!-- Governance rule -->
  <rect x="130" y="966" width="1660" height="62" rx="18" fill="#1e4533" stroke="#6b9073" stroke-width="1"/>
  <circle cx="170" cy="997" r="13" fill="#e9bd85"/>
  <path d="M164 997l4 4 8-9" fill="none" stroke="#173528" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="205" y="1004" class="note">治理底线：未核验内容只作为“待补知识”信号，不自动写入正式知识库，也不当作事实向公众回答。</text>
  <text x="1664" y="1003" text-anchor="end" class="tiny">英歌小槌 · 公众问答知识闭环</text>
</svg>
